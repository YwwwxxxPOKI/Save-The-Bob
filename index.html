<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Save the Bob"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#f1e3cf"><meta name="color-scheme" content="light">
<title>Save the Bob | Deluxe Edition</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" defer></script>
<style>
:root{color-scheme:light only;forced-color-adjust:none;--bg:#f1e3cf;--ink:#4b3a30;--card:#fff8ee;--peach:#ff9d7e;--sage:#8fcf9b;--gold:#ffcf5c;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:none;font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none;z-index:10}
.pill{background:var(--card);border-radius:20px;padding:8px 16px;box-shadow:0 6px 20px rgba(110,70,30,.18);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.6)}
.pill svg{width:20px;height:20px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(241,227,207,.85);backdrop-filter:blur(8px);padding:24px;text-align:center;z-index:20;transition:opacity .45s ease}
.screen.on{display:flex}
.screen.leaving{opacity:0;pointer-events:none}
.sub{opacity:.7;font-weight:600;max-width:320px;line-height:1.5;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:22px;padding:15px 28px;font:800 18px inherit;font-family:inherit;color:#fff;background:var(--peach);box-shadow:0 6px 0 #d96e4f,0 12px 24px rgba(110,70,30,.2);cursor:pointer;min-width:210px;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d96e4f,0 4px 10px rgba(110,70,30,.2)}
.btn.sg{background:var(--sage);box-shadow:0 6px 0 #5ba36a,0 12px 24px rgba(110,70,30,.2)}
.btn.sg:active{box-shadow:0 2px 0 #5ba36a}
.btn.sm{padding:10px 18px;min-width:0;font-size:14px;border-radius:16px;box-shadow:0 4px 0 #d96e4f}
.btn svg{width:22px;height:22px;fill:currentColor}
.sq-group{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:10px;z-index:30}
.sq{width:48px;height:48px;border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 16px rgba(110,70,30,.15);display:grid;place-items:center;color:var(--ink);cursor:pointer;border:2px solid rgba(255,255,255,.6);transition:transform .1s ease}
.sq:active{transform:scale(.92)}
.sq svg{width:24px;height:24px;fill:currentColor}
#pauseBtn{display:none}
body.ingame #pauseBtn{display:grid}
body.ingame #settingsBtn{display:none}
.tabs{display:flex;gap:6px;background:rgba(75,58,48,.12);padding:5px;border-radius:18px}
.tab{border:0;background:none;font:800 15px inherit;font-family:inherit;padding:9px 22px;border-radius:14px;color:var(--ink);cursor:pointer}
.tab.on{background:var(--card);box-shadow:0 3px 10px rgba(110,70,30,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,3vmin,14px);width:min(380px,100%);max-height:54vh;overflow-y:auto;padding:6px;touch-action:pan-y}
.item{background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(110,70,30,.1);border:2px solid rgba(255,255,255,.8)}
.item.sel{outline:4px solid var(--sage);box-shadow:0 8px 24px rgba(143,207,155,.3)}
.item canvas{width:min(88px,22vmin,26vw);height:min(88px,22vmin,26vw);aspect-ratio:1}
.item b{font-size:16px}
.big{font-size:48px;font-weight:900;color:var(--ink);text-shadow:0 3px 10px rgba(110,70,30,.15)}
#nr{font-weight:900;color:#d96e4f;font-size:22px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
#nr:empty{display:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#home{background:none;backdrop-filter:none;justify-content:center}
#home h1{margin:0;white-space:nowrap;font-size:clamp(38px,12vw,68px);font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;color:#fff8ee;-webkit-text-stroke:9px #4b3a30;paint-order:stroke fill;text-shadow:0 8px 0 rgba(75,58,48,.0),0 10px 24px rgba(0,0,0,.35);animation:drop 1s cubic-bezier(.3,1.6,.5,1) both .1s}
.menu-skin-slot{width:1em;height:1em;margin:0 .02em;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#home .bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;align-items:center;gap:12px}
#home .bot>*{animation:up .6s ease both}#home .bot>:nth-child(1){animation-delay:.9s}#home .bot>:nth-child(2){animation-delay:1.05s}#home .bot>:nth-child(3){animation-delay:1.2s}
#best{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:16px;font-weight:800;opacity:.8;font-size:17px;background:var(--card);padding:8px 14px;border-radius:16px;box-shadow:0 4px 12px rgba(110,70,30,.15)}
#best:empty{display:none}
@keyframes drop{from{transform:translateY(-200px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
/* Açılış korosu */
#halo{position:absolute;left:50%;top:46%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:radial-gradient(circle,rgba(255,244,190,.6) 0%,rgba(255,244,190,0) 36%);opacity:0;pointer-events:none;z-index:-1;transition:opacity 1.4s}
#home.sing #halo{opacity:1}
#home.pre .bot{visibility:hidden}
#home.pre .bot>*{animation:none}
#home.rev .bot>:nth-child(1){animation-delay:.05s}#home.rev .bot>:nth-child(2){animation-delay:.2s}#home.rev .bot>:nth-child(3){animation-delay:.35s}
#home h1{transition:filter .8s}
#home.sing h1{animation:drop 1s cubic-bezier(.3,1.6,.5,1) both .1s,trem .11s linear infinite;filter:drop-shadow(0 0 14px rgba(255,236,160,.9))}
#home.big h1{animation:drop 1s cubic-bezier(.3,1.6,.5,1) both .1s,trem2 .08s linear infinite;filter:drop-shadow(0 0 30px rgba(255,242,170,1))}
@keyframes trem{0%{translate:0 0;rotate:0deg}25%{translate:-1.2px .8px;rotate:-.3deg}50%{translate:1px -.8px;rotate:.3deg}75%{translate:-.8px -.6px;rotate:-.2deg}100%{translate:0 0;rotate:0deg}}
@keyframes trem2{0%{translate:0 0;rotate:0deg}25%{translate:-2.2px 1.4px;rotate:-.6deg}50%{translate:2px -1.4px;rotate:.6deg}75%{translate:-1.4px -1px;rotate:-.4deg}100%{translate:0 0;rotate:0deg}}
#tapHint{display:none;position:absolute;left:0;right:0;bottom:18%;font-size:22px;font-weight:900;color:#fff8ee;text-shadow:3px 0 #2b1d14,-3px 0 #2b1d14,0 3px #2b1d14,0 -3px #2b1d14;animation:blink 1.4s ease-in-out infinite;pointer-events:none}
#home.pre:not(.sing) #tapHint{display:none}
#home.wait #tapHint{display:block}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
/* Küçük şeffaf öğretici */
#tut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);display:none;gap:8px;z-index:15;pointer-events:none;opacity:0;transition:opacity .5s;width:max-content;max-width:94vw}
#tut.on{display:flex}#tut.vis{opacity:1}
#tut .tc{display:flex;align-items:center;gap:6px;background:rgba(43,29,20,.3);color:#fff8ee;border-radius:12px;padding:5px 9px;font-weight:800;font-size:12px;opacity:.5;line-height:1.15}
#tut .tc.act{opacity:1;background:rgba(43,29,20,.45)}
#tut svg{width:28px;height:28px;flex:none}
.tphone{animation:tph 1.8s ease-in-out infinite;transform-origin:50% 60%}
.tfing{animation:tfn 1.8s ease-in-out infinite}
@keyframes tph{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes tfn{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);background:var(--card);padding:10px 22px;border-radius:18px;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(110,70,30,.25);opacity:0;pointer-events:none;white-space:nowrap;z-index:100;border:2px solid rgba(255,255,255,.8)}
#toast.on{animation:tst 2.2s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}15%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.95)}}
.settings-box{background:var(--card);border-radius:26px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:18px;box-shadow:0 8px 24px rgba(110,70,30,.12);text-align:left;border:2px solid rgba(255,255,255,.8)}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:700;font-size:17px}
.setting-row select{background:var(--bg);border:2px solid rgba(75,58,48,.2);border-radius:14px;padding:8px 14px;font:inherit;color:var(--ink);font-weight:700;outline:none}
.setting-row input[type=range]{width:150px;accent-color:#ff9d7e;touch-action:pan-x}

html,body,button,select,input,.btn,.pill,.tab,.sub,.big{font-family:PxFont,monospace!important;font-weight:400!important;-webkit-font-smoothing:none;font-smooth:never;letter-spacing:0;line-height:1.35;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
*{border-radius:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
canvas,img,svg{image-rendering:pixelated;shape-rendering:crispEdges}
.btn{font-size:20px!important;padding:14px 22px;min-width:240px;border:4px solid #2b1d14;box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.4),0 6px 0 #2b1d14!important;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.28),0 2px 0 #2b1d14!important}
.btn:disabled{filter:grayscale(1);opacity:.7}
.btn.sm{min-width:0;padding:8px 14px}.btn svg{width:24px;height:24px}
.sq{border:4px solid #2b1d14!important;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),0 4px 0 #2b1d14!important}
.pill{font-size:20px!important;border:4px solid #2b1d14!important;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15),0 4px 0 #2b1d14!important}
.tab{font-size:20px!important;border:3px solid transparent!important}.tab.on{box-shadow:none!important;border-color:#2b1d14!important}
.item{border:4px solid #2b1d14!important;box-shadow:0 4px 0 #2b1d14!important}.item b{font-size:20px!important}
.settings-box{border:4px solid #2b1d14!important;box-shadow:0 6px 0 #2b1d14!important}
.setting-row,.sub,#best,#toast,.setting-row select{font-size:20px!important}
.setting-row select{border:3px solid #2b1d14!important}
#toast,#best{border:4px solid #2b1d14!important;box-shadow:0 4px 0 #2b1d14!important}
.big{font-size:60px!important;text-shadow:4px 4px 0 rgba(0,0,0,.2)}#nr{font-size:30px!important}#txtPauseTitle{font-size:40px!important}
#home h1{font-size:40px!important;-webkit-text-stroke:0!important;color:#fff8ee;text-shadow:4px 0 #2b1d14,-4px 0 #2b1d14,0 4px #2b1d14,0 -4px #2b1d14,4px 4px #2b1d14,-4px -4px #2b1d14,4px -4px #2b1d14,-4px 4px #2b1d14,0 10px 0 rgba(0,0,0,.3)!important}
@media(min-width:600px){#home h1{font-size:60px!important}}
.setting-row input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:#2b1d14}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:28px;margin-top:-8px;background:#ff9d7e;border:4px solid #2b1d14}
input[type=range]::-moz-range-track{height:12px;background:#2b1d14}
input[type=range]::-moz-range-thumb{width:12px;height:20px;background:#ff9d7e;border:4px solid #2b1d14}
#mpInfo{min-height:60px;max-width:320px}
.mpwrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(380px,100%);max-height:100%;min-height:0;overflow-y:auto;padding:6px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.mpcard{background:var(--card);border:4px solid #2b1d14;padding:12px;width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 4px 0 #2b1d14}
.mprow{display:flex;gap:8px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mprow input,#mpCode,#mpFid{flex:1;min-width:0;font:inherit;padding:8px;border:3px solid #2b1d14;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.mpli{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;width:100%;font-size:17px}
.mpli>span{flex:1 1 100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mpli>.mprow{justify-content:flex-end;width:auto}
.mpsec{font-size:18px;font-weight:900;align-self:flex-start}
.mpname{font-size:22px;font-weight:900}
.mpid{font-size:15px;opacity:.75;word-break:break-all;text-align:center}
.mpcode{font-size:34px;letter-spacing:6px;font-weight:900}

.hud{justify-content:flex-start!important;padding-left:12px}
@media (max-width:360px){.item{padding:8px}.item b{font-size:14px!important}.btn{min-width:0;padding:12px 20px;font-size:16px}}
@media (min-width:600px) and (min-height:700px){.grid{width:min(460px,100%)}.item canvas{width:100px;height:100px}}

function onOrient(e){

 let x=e.gamma,y=e.beta;
 const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 if(a===90||a===-270){x=e.beta;y=-e.gamma}else if(a===-90||a===270){x=-e.beta;y=e.gamma}else if(a===180||a===-180){x=-e.gamma;y=-e.beta}
 if(!tCal)tCal={x,y};

}

// ===== Açılış korosu: "Save the Bob" (WebAudio, katedral yankısı) =====
const VOW={a:[800,1150,2900],e:[500,1850,2700],u:[600,1200,2600],o:[500,880,2800],oo:[330,780,2600]};
const CH_LVL=.3;
function mkIR(c){const L=c.sampleRate*3|0,b=c.createBuffer(2,L,c.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}return b}
function chSeg(c,dst,wet,t,hold,fr,va,vb,tv,vol){
 const env=c.createGain(),at=Math.min(.5,hold*.3),end=t+hold+1.8;
 env.gain.setValueAtTime(.0001,t);env.gain.linearRampToValueAtTime(vol,t+at);env.gain.setValueAtTime(vol,t+hold);env.gain.setTargetAtTime(.0001,t+hold,.28);
 const sd=c.createGain();sd.gain.value=.9;env.connect(dst);env.connect(sd);sd.connect(wet);
 const A=VOW[va],B=VOW[vb];
 const fl=[0,1,2].map(i=>{const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.Q.value=[7,9,11][i];f.frequency.setValueAtTime(A[i],t);f.frequency.setValueAtTime(A[i],t+tv);f.frequency.linearRampToValueAtTime(B[i],t+tv+.35);g.gain.value=[1,.6,.3][i];f.connect(g);g.connect(env);return f});
 fr.forEach((fq,vi)=>[-9,8].forEach(dc=>{const o=c.createOscillator(),lf=c.createOscillator(),lg=c.createGain();o.type='sawtooth';o.frequency.value=fq;o.detune.value=dc;lf.frequency.value=5+vi*.21;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(16,t+hold*.8);lf.connect(lg);lg.connect(o.detune);fl.forEach(f=>o.connect(f));o.start(t);lf.start(t);o.stop(end);lf.stop(end)}))}
function playChoir(c,dst,T0,lvl){
 lvl=(lvl==null?CH_LVL:lvl);
 const cv=c.createConvolver();cv.buffer=mkIR(c);const wg=c.createGain();wg.gain.value=.55;cv.connect(wg);wg.connect(dst);
 chSeg(c,dst,cv,T0,1.55,[146.83,220,293.66,369.99,440],'a','e',1.2,.8*lvl);        // "Saaa-ve"
 chSeg(c,dst,cv,T0+1.95,.5,[98,246.94,293.66,392,493.88],'u','u',0,.55*lvl);        // "the"
 chSeg(c,dst,cv,T0+2.6,1.9,[146.83,220,293.66,440,587.33],'o','oo',1.4,1.0*lvl);    // "BOOOOB"
 const n=c.createBuffer(1,c.sampleRate*.12|0,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=n;f.type='bandpass';f.frequency.value=380;f.Q.value=.9;
 g.gain.setValueAtTime(.0001,T0+4.5);g.gain.linearRampToValueAtTime(.35*lvl,T0+4.52);g.gain.exponentialRampToValueAtTime(.0001,T0+4.63);
 s.connect(f);f.connect(g);g.connect(dst);s.start(T0+4.5)}
let introDone=false,introBusy=false,introTm=0,introTm2=0,introTm3=0,choirDone=false,choirDur=3.2;
function revealHome(){if(introDone)return;introDone=true;clearTimeout(introTm);clearTimeout(introTm2);clearTimeout(introTm3);const hm=$('home');hm.classList.remove('pre','sing','big','wait');hm.classList.add('rev')}
// Fish Audio erkek sesleri ("Save the Bob!") 3 katman + hafif perde farki + katedral yankisi = koro
function playFishChoir(){
 const ks=['choir1','choir2','choir3'].filter(k=>VB[k]);if(!ks.length)return 0;
 const t0=ac.currentTime+.05,cv=ac.createConvolver();cv.buffer=mkIR(ac);const wg=ac.createGain();wg.gain.value=.9;cv.connect(wg);wg.connect(mg);
 const rates=[1,.84,1.12,.93,1.06,.78],gains=[.9,.7,.6,.5,.5,.35];let mx=0,n=0;
 for(let i=0;i<6;i++){const b=VB[ks[i%ks.length]],r=rates[i],s=ac.createBufferSource(),gn=ac.createGain(),d=Math.min(b.duration/r,5);
  s.buffer=b;s.playbackRate.value=r;const st0=t0+(i%3)*.035;gn.gain.setValueAtTime(gains[i]*.55,st0);gn.gain.setValueAtTime(gains[i]*.55,st0+Math.max(.1,d-.25));gn.gain.linearRampToValueAtTime(.0001,st0+d);
  s.connect(gn);gn.connect(mg);gn.connect(cv);s.start(st0,0,d+.02);mx=Math.max(mx,d+(i%3)*.035)}
 return mx}
function tryChoirAudio(){
 if(choirDone)return;if(muted){choirDone=true;return}
 try{initAudio();if(!ac||ac.state!=='running')return;
  choirDone=true;clearTimeout(introTm3);$('home').classList.remove('wait');
  const d=playFishChoir();let dur;
  if(d){choirDur=d+.6;dur=d+.3}else{playChoir(ac,mg,ac.currentTime+.05);dur=4.8}
  if(!introDone){clearTimeout(introTm);clearTimeout(introTm2);introTm2=setTimeout(()=>$('home').classList.add('big'),Math.max(700,dur*300));introTm=setTimeout(revealHome,dur*1000)}}catch(e){}}
function holyIntro(){
 if(introBusy||introDone)return;introBusy=true;
 $('home').classList.add('sing');
 if(muted){choirDone=true;introTm2=setTimeout(()=>$('home').classList.add('big'),900);introTm=setTimeout(revealHome,1700);return}
 // Acilir acilmaz calmaya calis. Sesler yuklenene kadar (en fazla 3 sn) bekle, butonlar koro bitince gelir.
 try{initAudio()}catch(e){}
 const rs=ac?Promise.race([ac.resume().catch(()=>{}),new Promise(r=>setTimeout(r,400))]):Promise.resolve();
 Promise.all([rs,Promise.race([voicesReady,new Promise(r=>setTimeout(r,3000))])]).then(()=>{
  if(choirDone||introDone)return;
  tryChoirAudio();
  // Tarayici sesi engellediyse: ilk dokunus/tus korosunu baslatir. 6 sn kimse dokunmazsa butonlar yine de gelir.
  if(!choirDone){$('home').classList.add('wait');introTm3=setTimeout(revealHome,6000)}
 });
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,()=>{if(choirDone)return;try{initAudio();if(ac)ac.resume().then(()=>Promise.race([voicesReady,new Promise(r=>setTimeout(r,1500))])).then(()=>{if(st==='home')tryChoirAudio();else choirDone=true}).catch(()=>{})}catch(e){}},{passive:true}));
$('home').classList.add('pre');
// Koro baslamadan (ses engelliyse) dokunus korosunu baslatir, atlama yapmaz; koro calarken dokunursan butonlar hemen gelir.
$('home').addEventListener('pointerdown',()=>{if(introDone||!choirDone)return;revealHome()});
addEventListener('keydown',()=>{if(introDone||st!=='home'||!choirDone)return;revealHome()});
try{$('tapHint').textContent=T().tap}catch(e){}
holyIntro();
// ===== Küçük şeffaf öğretici (iki kontrol için) =====
let tutOn=false,tutT=0;
function showTut(){
 if((S.tutN|0)>=3)return;S.tutN=(S.tutN|0)+1;save();
 const t=T();$('tutTiltTx').textContent=t.tutTilt;$('tutTouchTx').textContent=t.tutTouch;
 $('tutTilt').classList.toggle('act',S.ctrl==='tilt');$('tutTouch').classList.toggle('act',S.ctrl!=='tilt');
 const e=$('tut');e.classList.add('on');void e.offsetWidth;e.classList.add('vis');tutOn=true;tutT=performance.now()}
function hideTut(){if(!tutOn)return;tutOn=false;const e=$('tut');e.classList.remove('vis');setTimeout(()=>{if(!tutOn)e.classList.remove('on')},600)}
setInterval(()=>{if(!tutOn)return;const el=performance.now()-tutT;if(el>6500||(el>2500&&Math.hypot(tilt.x,tilt.y)>.35)||st==='home'||st==='fall'||st==='over')hideTut()},200);
